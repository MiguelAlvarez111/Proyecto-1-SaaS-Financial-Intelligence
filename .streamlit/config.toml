[theme]
# Color principal
primaryColor = "#1f77b4"

# Color de fondo
backgroundColor = "#ffffff"

# Color de fondo secundario
secondaryBackgroundColor = "#f0f2f6"

# Color del texto
textColor = "#262730"

# Fuente
font = "sans serif"

[server]
# Puerto por defecto
port = 8501

# Habilitar CORS
enableCORS = false

# Habilitar XSRF protection
enableXsrfProtection = true

[browser]
# Abrir automáticamente el navegador
gatherUsageStats = false
